[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "smstools-http-api"
dynamic = ["version"]
description = "REST HTTP API for SMS Server Tools 3"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Leonid Vasiliev"}]
maintainers = [{name = "Mario Fetka", email = "mario.fetka@gmail.com"}]
requires-python = ">=3.11"
dependencies = [
    "Flask>=2.2",
    "Flask-HTTPAuth>=4.4",
    "passlib>=1.7.4",
]
classifiers = [
    "Framework :: Flask",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Telephony",
]

[project.optional-dependencies]
server = ["gunicorn>=20"]

[project.scripts]
smstools-http-api = "smstools_http_api.__main__:main"

[project.urls]
Homepage = "https://github.com/geosone/smstools-http-api"
Upstream = "https://github.com/lvasiliev/smstools-http-api"

[tool.setuptools]
packages = ["smstools_http_api", "smstools_http_api.api_1_0"]

[tool.setuptools.dynamic]
version = {attr = "smstools_http_api.__version__"}
